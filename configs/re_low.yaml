# Regime: LOW Reynolds number (target Re_f = 10, measured at runtime).
#
# Reynolds convention (docs/equations.md): Re_f = u_rms / (nu * k_f), where
# u_rms is the measured stationary rms velocity and k_f = 2*pi*n_f/Ly is the
# forcing wavenumber.  The velocity scale is CALIBRATED to u_rms ~ 1
# (forcing amplitude adjusted until the measured stationary u_rms matches
# target_u_rms within tolerance), so nu := target_u_rms/(target_re_f*k_f)
# makes Re_f exact by construction and Re_f ratios across regimes equal nu
# ratios.  The measured value is recorded in the dataset metadata.
#
# Resolution: N=64 gives k_max = floor(64/3) = 21 (2/3 rule), with the
# measured 2D dissipation wavenumber k_d ~ 7-9 at these parameters
# (k_max/k_d ~ 2.9), satisfying the documented criterion k_max >= 2*k_d.

name: re_low
description: "Kolmogorov flow, low-Reynolds regime (target measured Re_f = 10)"

domain:
  Lx: 6.283185307179586   # 2*pi
  Ly: 6.283185307179586

grid:
  Nx: 64
  Ny: 64

forcing:
  type: kolmogorov
  amplitude: 1.3          # A; auto-calibrated to hit target u_rms (see calibration)
  mode: 4                 # n_f: k_f = 2*pi*4/L = 4 (on the 2*pi domain)

viscosity:
  mode: from_target_reynolds
  target_re_f: 10.0
  target_u_rms: 1.0
  drag: 0.05              # linear (Ekman) friction; absorbs inverse-cascade energy

time:
  dt: 0.004
  t_total: 250.0
  dt_sample: 0.25
  max_courant: 1.0
  fail_courant: 2.0

numerics:
  dealias: "2/3"
  integrator: etdrk4

initial_condition:
  type: band_limited_random
  u_rms: 1.0
  k_cut: 8                # IC energy cutoff at mode number 8 = 2*k_f
  seed: 1000

calibration:
  enabled: true
  target_u_rms: 1.0
  tolerance: 0.03
  max_iterations: 4
  pilot_measure: 20.0
  pilot_reequilibrate: 60.0

stationarity:
  min_burn: 30.0
  window: 40.0
  chunk: 5.0
  max_burn: 300.0
  drift_e: 0.02
  drift_z: 0.05
  balance: 0.03

output:
  n_traj: 2
  seed_offset: 0
  dtype: float32
  directory: data
